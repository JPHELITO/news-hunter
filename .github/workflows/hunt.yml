name: News Hunter — manual/backup

# Cadência real de 5 min agora é mantida pelo workflow `hunt-loop.yml`
# (loop self-restarting). Este aqui fica como disparo manual de emergência.
# O cron */5 foi removido porque o GitHub Actions atrasa scheduled runs em
# horários de baixa carga (observado: gaps de 5-13h em vez de 5 min).

on:
  workflow_dispatch:   # apenas manual

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # mata se travar antes do próximo ciclo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip            # cache do pip entre runs → startup < 10s

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hunter
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hunt.py

      - name: Concurrency guard
        if: always()
        run: echo "Run complete"

concurrency:
  group: news-hunter
  cancel-in-progress: true   # cancela run anterior se ainda estiver rodando
