name: Hub export — envio manual ao Feeder (Commodities Datahouse)
# ─────────────────────────────────────────────────────────────────────────────
# Manda à mão os arquivos públicos da seção Commodities Datahouse do hub de dashboards do
# Itaú (hub_export/) ao Dashboard Data Feeder, que os publica no Mindassets.
#
# O envio NORMAL é o fim de cada ciclo do hunt-loop (hunt.py, com HUB_EXPORT_ENABLED=1).
# Este botão existe para o canário do WP1.4 e para reenviar depois de um conserto.
# Runner novo = sem estado: cada arquivo é comparado com a cópia PUBLICADA e só vai o que
# mudou; `force` manda todos os pedidos mesmo iguais.
#
# SEM AGENDAMENTO de propósito (o relógio confiável é o hunt-loop; o cron do GitHub atrasa).
# As entradas passam por variável de ambiente, nunca direto no script (evita injeção).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Arquivos: all, ou lista (config,live,intraday,quotes-daily,news-latest,news-digest,calendar,reports,news-week,news-index,quotes-monthly,commodities-daily,ratings,mw-companies,mw-short-interest,mw-buybacks,mw-insiders,mw-filings,mw-short,history,history-index,stock-guide,sg-sensitivity,data-sources,glossary; uma semana: news-week-2026-w45; o histórico de um papel: history-vale3.sa; o aluguel de uma empresa: mw-short-vale3; setores: sectors (os 36), mm, pp, mm-countries, mm-raw, pp-raw, ou um arquivo: mm-trade, mm-domestic, mm-prediction, mm-countries-imp-total, mm-raw-secex-country, mm-index, pp-pulp-exports, pp-woodchips, pp-paper, pp-corrugated, pp-raw-empapel, pp-index…)"
        type: string
        default: all
      force:
        description: "Ignorar hash e cadência (envia mesmo sem mudança)"
        type: boolean
        default: false
      rebuild:
        description: "Reler o banco em vez das cópias publicadas (depois de conserto manual de notícia)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hub-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Exportar e enviar ao Feeder
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:        ${{ secrets.SUPABASE_SERVICE_KEY }}
          DASHBOARD_FEEDER_URL:        ${{ vars.DASHBOARD_FEEDER_URL }}
          DASHBOARD_FEEDER_PROJECT_ID: ${{ vars.DASHBOARD_FEEDER_PROJECT_ID }}
          DASHBOARD_FEEDER_API_KEY:    ${{ secrets.DASHBOARD_FEEDER_API_KEY }}
          # setores (Onda 3): os bancos SQLite do repositório público do site pela API do GitHub — o
          # token do próprio job (1.000 chamadas/h); sem ele, os arquivos mm-*/pp-* ficam fora
          GH_TOKEN:                    ${{ github.token }}
          PYTHONIOENCODING:            utf-8
          HUB_FILES:                   ${{ inputs.files }}
          HUB_FORCE:                   ${{ inputs.force }}
          HUB_REBUILD:                 ${{ inputs.rebuild }}
        run: |
          set -- --only "${HUB_FILES:-all}"
          if [ "$HUB_FORCE" = "true" ]; then set -- "$@" --force; fi
          if [ "$HUB_REBUILD" = "true" ]; then set -- "$@" --rebuild; fi
          echo "rodando: python -m hub_export $*"
          python -m hub_export "$@"
