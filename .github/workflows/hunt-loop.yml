name: Hunt Loop — 5min real cadence (self-restarting)
# Solução para o problema do scheduled cron do GitHub Actions, que em horários
# de baixa carga atrasa runs por horas. Este workflow roda em loop contínuo
# chamando hunt.py a cada 5 min real, garantindo cadência precisa.
#
# Como funciona:
#   1. Um único job roda por até 5h50min, fazendo loop com sleep 300s
#   2. Antes de terminar, dispara a si mesmo via gh workflow run
#   3. O run subsequente continua o ciclo — corrente contínua sem gaps
#
# Backups:
#   - schedule */6h: caso o auto-restart falhe, ressuscita em <= 6h
#   - hunt.yml (cron */5): segue ativo como rede de segurança secundária
#
# Custo: repos públicos têm minutos ilimitados no GitHub Actions free tier.

on:
  workflow_dispatch:
  schedule:
    # Rede de segurança: a cada 30 min o GitHub tenta um novo run. Se já há um loop
    # em andamento, o novo fica PENDING (concurrency group; cancel-in-progress=false
    # não cancela o atual) e roda quando o atual terminar — ressuscita o sistema em
    # <= 30 min em qualquer falha/cancelamento, sem intervenção manual.
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write             # necessário para gh workflow run via GITHUB_TOKEN

concurrency:
  group: hunt-loop
  cancel-in-progress: false  # nunca cancela um loop em andamento

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # 5h55min — margem antes do limite de 6h

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # histórico completo para git pull funcionar

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hunt every 5 minutes for ~5h30min (auto-updating)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
          # FASE 3 — IA de takes em modo SHADOW (grava SÓ take_llm; dashboard/Market Pulse
          # INALTERADOS). Habilitado só AQUI (não no hunt-playwright) p/ evitar corrida
          # entre os 2 loops. Prompts vêm da tabela Supabase llm_prompts (RLS).
          LLM_TAKES_ENABLED:    "1"
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          # 2026-08-03: reforço grátis/sem-cartão que sucede a Cerebras (paga a partir de 17/ago).
          # Dormente até o secret ZAI_API_KEY existir (chave vazia = provedor pulado no CHAIN — nada quebra).
          ZAI_API_KEY:          ${{ secrets.ZAI_API_KEY }}
          # Para disparar o pulse_daily.yml (ver o bloco "Market Pulse" dentro do loop).
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e   # não aborta o loop se uma iteração falhar
          deadline=$(( $(date +%s) + 19800 ))   # 5h30min em segundos
          i=0
          last_sha=""
          pulse_ultimo_corte=""      # anti-repique do gatilho do Market Pulse
          pulse_ultimo_em=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            echo "============================================================"
            echo "▶ Iteration $i — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"

            # Self-update: pega o código mais recente antes de cada iteração
            git fetch origin master --quiet 2>&1 | head -5
            new_sha=$(git rev-parse origin/master)
            if [ "$new_sha" != "$last_sha" ]; then
              echo "↻ Code updated: $new_sha — pulling and reinstalling deps"
              git reset --hard origin/master
              # Reinstala deps se requirements.txt mudou
              if [ -n "$last_sha" ] && ! git diff --quiet "$last_sha" "$new_sha" -- requirements.txt; then
                pip install -r requirements.txt --quiet
              fi
              last_sha="$new_sha"
            fi

            start=$(date +%s)
            python hunt.py || echo "⚠ hunt.py failed at iter $i — continuing"

            # ── Market Pulse: gatilho que NÃO depende do cron do GitHub ──────────────
            # Entre 27/08 e 01/09 de 2026 o `schedule:` do pulse_daily.yml disparou às
            # 00:16, 02:55, 04:32 e 17:14 UTC em vez das 09:50/11:50 combinadas. Resultado:
            # os cortes da manhã de 01/09 não saíram, e as rodadas de madrugada gravaram
            # foto da noite anterior por cima das boas. Esta corrente aqui é a coisa mais
            # confiável que roda no repo — então ela passou a ser o relógio do pulse.
            # O tick só PERGUNTA (janela aberta? foto já existe?) e imprime o corte; quem
            # executa continua sendo o pulse_daily.yml, na concurrency dele — de dentro
            # daqui a foto ficaria presa atrás desta corrente de 5h55.
            python -m scripts.pulse_tick >/tmp/pulse_cut.txt 2>/tmp/pulse_tick.log || true
            pulse_cut="$(tr -d '[:space:]' < /tmp/pulse_cut.txt)"
            agora_s=$(date +%s)
            if [ -n "$pulse_cut" ]                && { [ "$pulse_cut" != "$pulse_ultimo_corte" ] || [ $((agora_s - pulse_ultimo_em)) -gt 900 ]; }; then
              # O anti-repique existe porque o tick pergunta ao BANCO: entre o disparo e a
              # foto ficar gravada passam ~1 min, e sem isto duas iterações seguidas
              # dispariam o mesmo corte. 15 min = tempo de sobra para a rodada acontecer,
              # e curto o bastante para uma tentativa que falhou ser refeita na janela.
              cat /tmp/pulse_tick.log
              echo "▶ Market Pulse: corte $pulse_cut na janela e sem foto — disparando pulse_daily.yml"
              if gh workflow run pulse_daily.yml --ref ${{ github.ref_name }} -f cut="$pulse_cut"; then
                pulse_ultimo_corte="$pulse_cut"; pulse_ultimo_em=$agora_s
              else
                echo "⚠ dispatch do pulse falhou — cron e próxima iteração seguem tentando"
              fi
            fi

            elapsed=$(( $(date +%s) - start ))
            sleep_for=$(( 300 - elapsed ))
            if [ "$sleep_for" -lt 30 ]; then sleep_for=30; fi
            echo "✓ Iteration $i done in ${elapsed}s — sleeping ${sleep_for}s"
            sleep "$sleep_for"
          done
          echo "Loop window reached — preparing self-restart"

      - name: Self-restart the loop
        # !cancelled(): sem isto o default é success() → se o step do loop sair ≠0
        # (ex.: git reset --hard trouxe código quebrado), o restart era pulado e só
        # o cron */30 ressuscitava. Reinicia em falha, mas respeita cancelamento.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next hunt-loop run..."
          gh workflow run hunt-loop.yml --ref ${{ github.ref_name }}
          echo "✓ Next run scheduled"
