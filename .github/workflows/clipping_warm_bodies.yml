name: Clipinator — aquecer corpos (À PARTE do news hunter)
# Pré-raspa e GUARDA os corpos das notícias candidatas em clipping_bodies (tabela separada), p/ o
# clipping ficar instantâneo (clique = corpo pronto) e o Word sair rápido (reusa o guardado).
# NÃO toca no news hunter: só LÊ o news_articles e escreve em clipping_bodies (tabela própria).
# Compartilha apenas a sessão keep-alive (Platts/FM), que este processo só rola pra frente.
# Repo público = minutos ilimitados; cada rodada é limitada por --budget.

on:
  workflow_dispatch:            # SÓ sob demanda — o cron foi DESLIGADO (2026-08-06)
  # DESLIGADO em 2026-08-06 a pedido do usuário. Dois motivos:
  #   1) Ele nunca usou o ganho: gerar o clipping leva ~1 min raspando na hora, e isso está de
  #      bom tamanho. O aquecedor só existia p/ tirar esse 1 min.
  #   2) CUSTO ESCONDIDO: a tradução usa `CLIPPING_TRANSLATE_KEY` **ou, se ausente, GEMINI_API_KEY**
  #      — a MESMA chave/cota dos takes. Rodando de hora em hora com --limit 80, isso disputava a
  #      cota do Gemini, que desde 2026-08-06 é o TITULAR dos takes (ver hunter/llm_take.py::CHAIN).
  #      Aquecer corpo de clipping não pode competir com classificar notícia do cliente.
  # Nada quebra: `clipping/generate.py` já busca o corpo guardado e, se não houver, raspa+traduz na
  # hora e GUARDA (`store_body`) — gerar 2x não re-traduz. O aquecedor era só adiantamento.
  # RELIGAR: descomentar o cron abaixo. Se religar, criar antes o secret CLIPPING_TRANSLATE_KEY
  # (chave Gemini DEDICADA) p/ não voltar a morder a cota dos takes.
  # schedule:
  #   - cron: "20 * * * *"      # de hora em hora (min 20, p/ não colidir com o hunt-loop)

permissions:
  contents: read

concurrency:
  group: clipinator-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.52.0-jammy
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-clip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt python-docx deep-translator lxml Pillow

      - name: Write session files from secrets
        env:
          PLATTS_STATE_JSON:       ${{ secrets.PLATTS_STATE_JSON }}
          PLATTS_CREDENTIALS:      ${{ secrets.PLATTS_CREDENTIALS }}
          FASTMARKETS_STATE_JSON:  ${{ secrets.FASTMARKETS_STATE_JSON }}
          FASTMARKETS_CREDENTIALS: ${{ secrets.FASTMARKETS_CREDENTIALS }}
          VALOR_STATE_JSON:        ${{ secrets.VALOR_STATE_JSON }}
          ESTADAO_STATE_JSON:      ${{ secrets.ESTADAO_STATE_JSON }}
        run: |
          mkdir -p /tmp/cookies
          if [ -n "$PLATTS_STATE_JSON" ]; then
            echo "$PLATTS_STATE_JSON" | base64 -d | gunzip > /tmp/cookies/platts_state.json \
              || echo "$PLATTS_STATE_JSON" > /tmp/cookies/platts_state.json
          fi
          [ -n "$PLATTS_CREDENTIALS" ] && echo "$PLATTS_CREDENTIALS" > /tmp/cookies/platts_credentials.json
          [ -n "$FASTMARKETS_STATE_JSON" ]  && echo "$FASTMARKETS_STATE_JSON"  > /tmp/cookies/fastmarkets_state.json
          [ -n "$FASTMARKETS_CREDENTIALS" ] && echo "$FASTMARKETS_CREDENTIALS" > /tmp/cookies/fastmarkets_credentials.json
          [ -n "$VALOR_STATE_JSON" ]   && echo "$VALOR_STATE_JSON"   > /tmp/cookies/valor_state.json
          [ -n "$ESTADAO_STATE_JSON" ] && echo "$ESTADAO_STATE_JSON" > /tmp/cookies/estadao_state.json
          echo "sessões preparadas"

      - name: Aquecer os corpos (lê news_articles, escreve clipping_bodies)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COOKIES_DIR:          /tmp/cookies
          PYTHONIOENCODING:     utf-8
          # Tradução bilíngue por IA (Gemini) — o aquecedor já traduz e guarda em clipping_bodies.
          ZAI_API_KEY:            ${{ secrets.ZAI_API_KEY }}
          CLIPPING_TRANSLATE_KEY: ${{ secrets.CLIPPING_TRANSLATE_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
        run: python -m clipping.warm_bodies --budget 900 --limit 80
